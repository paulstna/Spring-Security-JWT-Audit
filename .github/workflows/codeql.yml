name: CodeQL

# Static analysis for a project that is mostly about security. Findings land in
# the repository's Security tab. The weekly run matters as much as the per-push
# one: new query packs ship regularly and can flag code nobody has touched.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # Beyond the default set: adds the queries that need more context,
          # which is where injection and authorisation problems tend to live.
          queries: security-extended

      # Built by hand rather than by autobuild: the module is in a subdirectory,
      # and compiling without tests is all the analysis needs.
      - name: Compile
        working-directory: SpringSecurityApp
        run: ./mvnw -B --no-transfer-progress clean compile -DskipTests

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
