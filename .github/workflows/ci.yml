name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Integration tests start a PostgreSQL container through Testcontainers,
      # which works here because the runner already has Docker. The coverage
      # gate is part of `verify`, so a drop below 75% / 65% fails this step.
      - name: Run the full suite
        working-directory: SpringSecurityApp
        run: ./mvnw -B --no-transfer-progress verify

      - name: Report coverage
        if: always()
        working-directory: SpringSecurityApp
        run: |
          report=target/site/jacoco/jacoco.csv
          [ -f "$report" ] || { echo "No coverage report was produced."; exit 0; }
          python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import csv, sys

          COUNTERS = {'INSTRUCTION': 'Instructions', 'BRANCH': 'Branches', 'LINE': 'Lines'}
          FLOOR = {'INSTRUCTION': 75.0, 'BRANCH': 65.0, 'LINE': None}

          totals = {}
          with open(sys.argv[1]) as handle:
              for row in csv.DictReader(handle):
                  for counter in COUNTERS:
                      missed = int(row[f'{counter}_MISSED'])
                      covered = int(row[f'{counter}_COVERED'])
                      a, b = totals.get(counter, (0, 0))
                      totals[counter] = (a + missed, b + covered)

          print('## Coverage\n')
          print('| | Covered | Build fails below |')
          print('|---|---|---|')
          for counter, label in COUNTERS.items():
              missed, covered = totals[counter]
              total = missed + covered
              pct = (100 * covered / total) if total else 0
              floor = FLOOR[counter]
              gate = f'{floor:.0f}%' if floor else 'n/a'
              print(f'| {label} | {pct:.1f}% | {gate} |')
          PY

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: SpringSecurityApp/target/site/jacoco
          retention-days: 14

      # The console summary is too terse to debug from; these hold the stack traces.
      - name: Keep the test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            SpringSecurityApp/target/surefire-reports
            SpringSecurityApp/target/failsafe-reports
          retention-days: 14

  smoke:
    name: Smoke test the deployable image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite above runs against MockMvc: no servlet container, no socket,
      # no image. Everything below is what that cannot reach — the Dockerfile,
      # the compose wiring, the prod profile, and a real HTTP client with a
      # real cookie jar.
      - name: Write a throwaway .env
        run: |
          cat > .env <<EOF
          SPRING_PROFILES_ACTIVE=prod
          DB_NAME=spring_security_db
          DB_USERNAME=ci
          DB_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET_KEY=$(openssl rand -base64 64 | tr -d '\r\n')
          JWT_AUTH_EXPIRATION=900
          JWT_REFRESH_EXPIRATION=1296000
          EOF

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the application to report healthy
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "Healthy after ~$((attempt * 3))s."
              exit 0
            fi
            sleep 3
          done
          echo "::error::The application never became healthy."
          docker compose logs --no-color
          exit 1

      # 57 assertions over the real API. The collection is a published artifact,
      # so this also stops it from rotting the moment an endpoint changes.
      - name: Run the Postman collection
        run: |
          npx --yes newman@6 run \
            postman/Spring-Security-JWT-Audit.postman_collection.json \
            -e postman/environment.demo.json \
            --reporters cli,json --reporter-json-export newman-report.json

      - name: Show the audit trail the run produced
        if: always()
        run: |
          echo '## Security log from the smoke run' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker compose exec -T spring-security-app \
            sh -c 'tail -n 25 /app/logs/security.log' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo '(no security log)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Application logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Keep the newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report.json
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v
