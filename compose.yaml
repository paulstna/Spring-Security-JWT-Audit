services:
  postgresdb:
    image: postgres:17-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    
  spring-security-app:
      build:
        context: ./SpringSecurityApp
        dockerfile: Dockerfile
      container_name: spring-security-app 
      environment:
        # Demo users (admin/manager/user) are seeded by Flyway in every profile.
        # 'dev'  -> refresh cookie over plain HTTP + DEBUG logging (local testing).
        # 'prod' -> HTTPS-only cookie + INFO logging.
        # Set in .env, like every other variable here. Defaults to prod so a
        # missing entry can never silently downgrade cookie security.
        SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
        DB_HOST: postgresdb
        DB_PORT: 5432
        DB_NAME: ${DB_NAME}
        DB_USERNAME: ${DB_USERNAME}
        DB_PASSWORD: ${DB_PASSWORD}
        JWT_SECRET_KEY: ${JWT_SECRET_KEY}
        JWT_AUTH_EXPIRATION: ${JWT_AUTH_EXPIRATION:-900}
        JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-1296000}
      restart: unless-stopped
      ports:
        - "8080:8080"
      volumes:
        # A named volume, not a bind mount to ./logs. The container runs as a
        # non-root user, and Docker creates a missing bind-mount directory owned
        # by root, so on a clean host the application could not open its log
        # files and refused to start. Docker seeds a named volume from the image
        # instead, ownership included.
        #   docker compose exec spring-security-app tail -f /app/logs/security.log
        - app-logs:/app/logs
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 60s
      networks:
        - app-network
      depends_on:
        postgresdb:
          condition: service_healthy

networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  postgres-data:
  app-logs:
