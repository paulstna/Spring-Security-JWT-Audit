spring:
  application:
    name: spring-security-app
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    # Baseline any pre-existing (non-Flyway) schema so migrations apply cleanly
    # on databases created before Flyway was introduced.
    baseline-on-migrate: true
    # All migrations (schema + seeds) live here and run in every profile.
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  paths-to-match: /api/**

app:
  cookie:
    secure: true
  trust-proxy: false

jwt:
  secret-key: ${JWT_SECRET_KEY}
  auth-token:
    expiration: ${JWT_AUTH_EXPIRATION:900}      # 15 min
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:1296000} # 15 días

bucket:
  limited-endpoints:
    - login
    - register
    - refresh
  bucket-metrics:
    login:
      capacity: 5
      refill-tokens: 2
      refill-time: 60
    register:
      capacity: 3
      refill-tokens: 3
      refill-time: 600
    refresh:
      capacity: 3
      refill-tokens: 3
      refill-time: 300
